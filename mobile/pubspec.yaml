name: rdreporta
description: "Plataforma de información ciudadana y reportes geolocalizados de República Dominicana"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & Storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  
  # State Management
  flutter_bloc: ^8.1.6
  
  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  
  # Media & UI
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
