services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rdreporta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rdreporta_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in docker/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rdreporta_pgdata:/var/lib/postgresql/data
      - ../database/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rdreporta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: rdreporta-api:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rdreporta_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-rdreporta_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET_KEY:?Define JWT_SECRET_KEY in docker/.env}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__From=${SMTP_FROM:-soporte@rdreporta.com}
      - Authentication__GoogleClientId=${GOOGLE_CLIENT_ID:-}
    ports:
      - "5000:5000"
    volumes:
      - ../backend/src/RdReporta.Api/wwwroot/uploads:/app/wwwroot/uploads

volumes:
  rdreporta_pgdata:
    name: rdreporta_pgdata
