services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rdreporta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rdreporta_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rdreporta_pgdata:/var/lib/postgresql/data
      - ../database/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rdreporta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rdreporta_pgdata:
    name: rdreporta_pgdata
